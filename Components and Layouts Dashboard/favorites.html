<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Favourites</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #111; color: #eee; font-family: sans-serif; padding: 20px 24px 60px; }
  header { display: flex; align-items: center; gap: 16px; padding-bottom: 18px; border-bottom: 1px solid #2c2c2c; margin-bottom: 22px; }
  h1 { font-size: 18px; font-weight: 600; }
  header .count { color: #888; font-size: 13px; }
  header .spacer { flex: 1; }
  button, a.btn { background: #262626; color: #ddd; border: 1px solid #333; border-radius: 8px; padding: 6px 12px; font-size: 13px; cursor: pointer; text-decoration: none; }
  button:hover, a.btn:hover { border-color: #555; }
  button.danger:hover { border-color: #a33; color: #f99; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(460px, 1fr)); gap: 20px; }
  .card { background: #161616; border: 1px solid #262626; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
  .card .head { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid #262626; }
  .card .head .title { font-size: 13px; font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .head .meta { font-size: 11px; color: #777; }
  .card .head button, .card .head a.btn { padding: 4px 9px; font-size: 12px; }
  .crop { position: relative; width: 100%; aspect-ratio: 4 / 3; overflow: hidden; background: #fff; }
  .crop iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
  .empty { text-align: center; color: #777; padding: 80px 20px; font-size: 14px; }
  .empty a { color: #6cf; }
</style>
</head>
<body>
<header>
  <h1>★ Favourites</h1>
  <span class="count" id="count"></span>
  <span class="spacer"></span>
  <a href="viewer.html" class="btn">← Back to viewer</a>
  <button id="export">Export JSON</button>
  <button id="clear" class="danger">Clear all</button>
</header>
<div id="grid" class="grid"></div>
<div id="empty" class="empty" style="display:none">
  No favourites yet. Open the viewer, scroll to a design you like, and click <b>☆ Add to favourites</b>.
</div>

<script>
const FAV_KEY = "ui-viewer-favorites";
const grid = document.getElementById("grid");
const empty = document.getElementById("empty");
const countEl = document.getElementById("count");

function getFavs() {
  try { return JSON.parse(localStorage.getItem(FAV_KEY) || "[]"); } catch { return []; }
}
function saveFavs(list) { localStorage.setItem(FAV_KEY, JSON.stringify(list)); }

function render() {
  const favs = getFavs();
  countEl.textContent = favs.length ? `(${favs.length})` : "";
  if (!favs.length) {
    grid.innerHTML = "";
    empty.style.display = "block";
    return;
  }
  empty.style.display = "none";
  grid.innerHTML = "";
  favs.forEach((f, i) => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div class="head">
        <span class="title" title="${escapeAttr(f.label)}">${escapeHtml(f.label)}</span>
        <span class="meta">y=${f.y}px</span>
        <a class="btn" href="${encodeURI(f.file)}#frag" target="_blank" rel="noopener" title="Open in new tab">↗</a>
        <button class="danger" data-i="${i}" title="Remove">✕</button>
      </div>
      <div class="crop"><iframe loading="lazy" src="${encodeURI(f.file)}"></iframe></div>
    `;
    grid.appendChild(card);
  });
  grid.querySelectorAll("button[data-i]").forEach(b => {
    b.addEventListener("click", () => {
      const i = +b.dataset.i;
      const favs = getFavs();
      favs.splice(i, 1);
      saveFavs(favs);
      render();
    });
  });
  // scroll each iframe to its saved position once loaded
  grid.querySelectorAll(".crop iframe").forEach((fr, i) => {
    const f = favs[i];
    fr.addEventListener("load", () => {
      try { fr.contentWindow.scrollTo(f.x, f.y); } catch (e) {}
    });
  });
}

function escapeHtml(s) { return String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
function escapeAttr(s) { return escapeHtml(s).replace(/"/g, "&quot;"); }

document.getElementById("clear").addEventListener("click", () => {
  if (confirm("Remove all favourites?")) { saveFavs([]); render(); }
});
document.getElementById("export").addEventListener("click", () => {
  const blob = new Blob([JSON.stringify(getFavs(), null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "favourites.json";
  a.click();
});

render();
window.addEventListener("storage", render);
</script>
</body>
</html>
