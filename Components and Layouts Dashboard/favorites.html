<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Favourites</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #111; color: #eee; font-family: sans-serif; padding: 20px 24px 60px; }
  header { display: flex; align-items: center; gap: 16px; padding-bottom: 18px; border-bottom: 1px solid #2c2c2c; margin-bottom: 22px; }
  h1 { font-size: 18px; font-weight: 600; }
  header .count { color: #888; font-size: 13px; }
  header .spacer { flex: 1; }
  button, a.btn { background: #262626; color: #ddd; border: 1px solid #333; border-radius: 8px; padding: 6px 12px; font-size: 13px; cursor: pointer; text-decoration: none; }
  button:hover, a.btn:hover { border-color: #555; }
  button.danger:hover { border-color: #a33; color: #f99; }
  .list { display: flex; flex-direction: column; gap: 28px; max-width: 1400px; margin: 0 auto; }
  .card { background: #161616; border: 1px solid #262626; border-radius: 12px; overflow: hidden; }
  .card .head { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid #262626; }
  .card .head .title { font-size: 13px; font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .head .meta { font-size: 11px; color: #777; white-space: nowrap; }
  .card .head button, .card .head a.btn { padding: 4px 9px; font-size: 12px; }
  .viewport { position: relative; overflow: hidden; background: #fff; margin: 0 auto; }
  .viewport iframe { position: absolute; border: 0; }
  .empty { text-align: center; color: #777; padding: 80px 20px; font-size: 14px; }
  .empty a { color: #6cf; }
</style>
</head>
<body>
<header>
  <h1>★ Favourites</h1>
  <span class="count" id="count"></span>
  <span class="spacer"></span>
  <a href="viewer.html" class="btn">&larr; Back to viewer</a>
  <button id="export">Export JSON</button>
  <button id="clear" class="danger">Clear all</button>
</header>
<div id="list" class="list"></div>
<div id="empty" class="empty" style="display:none">
  No favourites yet. Open the viewer and click the &#9734; on any component you like.
</div>

<script>
const FAV_KEY = "ui-viewer-favorites";

const list = document.getElementById("list");
const empty = document.getElementById("empty");
const countEl = document.getElementById("count");

function getFavs() {
  try { return JSON.parse(localStorage.getItem(FAV_KEY) || "[]"); } catch { return []; }
}
function saveFavs(favs) { localStorage.setItem(FAV_KEY, JSON.stringify(favs)); }

function render() {
  let favs = getFavs();
  // drop anything saved by an older version of this page that didn't
  // record a proper width/height (would otherwise render as a broken,
  // tiny, scrollable box)
  const valid = favs.filter(f => f && f.file && Number.isFinite(f.w) && Number.isFinite(f.h) && f.w > 0 && f.h > 0);
  if (valid.length !== favs.length) { favs = valid; saveFavs(favs); }

  countEl.textContent = favs.length ? `(${favs.length})` : "";
  list.innerHTML = "";
  empty.style.display = favs.length ? "none" : "block";
  if (!favs.length) return;

  // as wide as the page allows (up to the component's own natural width) —
  // never shrunk into a small thumbnail, only scaled down if it wouldn't fit
  const available = Math.min(1400, window.innerWidth - 48);

  favs.forEach((f, i) => {
    const scale = Math.min(1, available / f.w);
    const dispW = Math.round(f.w * scale);
    const dispH = Math.round(f.h * scale);

    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div class="head">
        <span class="title" title="${escapeAttr(f.label)}">${escapeHtml(f.label)}</span>
        <span class="meta">${f.w}&times;${f.h}px</span>
        <a class="btn" href="${encodeURI(f.file)}" target="_blank" rel="noopener" title="Open the full file in a new tab">&#8599;</a>
        <button class="danger" data-i="${i}" title="Remove">&#10005;</button>
      </div>
      <div class="viewport" style="width:${dispW}px; height:${dispH}px;">
        <iframe
          loading="lazy"
          src="${encodeURI(f.file)}"
          style="width:${f.pageW}px; height:8000px; left:${-f.x}px; top:${-f.y}px; transform: scale(${scale}); transform-origin: ${f.x}px ${f.y}px;">
        </iframe>
      </div>
    `;
    list.appendChild(card);
  });

  list.querySelectorAll("button[data-i]").forEach(b => {
    b.addEventListener("click", () => {
      const i = +b.dataset.i;
      const favs = getFavs();
      favs.splice(i, 1);
      saveFavs(favs);
      render();
    });
  });
}

function escapeHtml(s) { return String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
function escapeAttr(s) { return escapeHtml(s).replace(/"/g, "&quot;"); }

document.getElementById("clear").addEventListener("click", () => {
  if (confirm("Remove all favourites?")) { saveFavs([]); render(); }
});
document.getElementById("export").addEventListener("click", () => {
  const blob = new Blob([JSON.stringify(getFavs(), null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "favourites.json";
  a.click();
});

let resizeTimer;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(render, 150);
});

render();
window.addEventListener("storage", render);
</script>
</body>
</html>
